<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SILIFON</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 40px;
      background: #fafafa; color: #222;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; font-weight: 600; }

    .opts {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      margin-bottom: 16px; align-items: flex-end;
    }
    .opt label {
      display: block; font-size: 0.75rem; color: #666; margin-bottom: 4px;
    }
    .opt select, .opt input[type="number"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; min-width: 100px;
    }

    #textInput {
      width: 100%;
      font-size: 1.1rem;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: "Songti SC", "SimSun", serif;
    }
    #textInput:focus { border-color: #1565c0; }

    .out-label {
      margin: 24px 0 10px;
      font-size: 0.8rem;
      color: #888;
    }
    #silifonOut {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 1;
    }
    .glyph {
      font-family: var(--silifon-family, serif);
      font-size: var(--glyph-size, 3rem);
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }
    .glyph:hover {
      border-color: #90caf9;
      background: #f5f9ff;
    }
    .glyph.no-structure { cursor: default; opacity: 0.85; }
    .glyph.no-structure:hover { border-color: transparent; background: #fff; }

    .hint { margin-top: 16px; font-size: 0.8rem; color: #aaa; }

    /* 字元结构弹窗 */
    #modalOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 999;
    }
    #modalOverlay[hidden] { display: none; }
    #modal {
      width: 100%; max-width: 640px; max-height: 80vh;
      background: #fff; border-radius: 12px;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
    }
    #modalHead {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    #modalTitle { font-weight: 600; }
    #modalClose {
      border: none; background: #eee; border-radius: 6px;
      padding: 6px 12px; cursor: pointer;
    }
    #modalBody { padding: 16px; overflow: auto; }
    #modalMeta { font-size: 0.85rem; color: #666; margin-bottom: 12px; }
    #jgBlock { margin: 0 0 16px; }
    #jgBlock[hidden] { display: none; }
    #jgLabel { font-size: 0.8rem; color: #888; margin: 0 0 8px; }
    #jgGrid {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .jg-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
    }
    .jg-thumb {
      width: 72px; height: 72px;
      background: #d7d5d0;
      border-radius: 6px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .jg-thumb img { width: 72px; height: 72px; object-fit: contain; }
    .jg-cap { font-size: 0.62rem; color: #888; max-width: 80px; text-align: center; }
    .comp-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .comp-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 10px;
      border: 1px solid #e8e8e8; border-radius: 8px;
      min-width: 88px; background: #fafafa;
    }
    .comp-card.clickable { cursor: pointer; }
    .comp-card.clickable:hover { border-color: #90caf9; background: #f5f9ff; }
    .comp-thumb {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Songti SC", serif;
      font-size: 2rem;
      background: #fff; border: 1px solid #eee; border-radius: 6px;
      overflow: hidden;
    }
    .comp-thumb img { width: 64px; height: 64px; object-fit: contain; }
    .comp-cap { font-size: 0.7rem; color: #555; text-align: center; }
    .comp-cap code { display: block; font-size: 0.62rem; color: #999; margin-top: 2px; }
    .empty { color: #999; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SILIFON</h1>
    <div class="opts">
      <div class="opt">
        <label for="fontSize">字体大小</label>
        <input id="fontSize" type="number" min="24" max="120" step="4" value="48" />
      </div>
      <div class="opt">
        <label for="fontFile">字体文件</label>
        <select id="fontFile">
          <option value="silifon">silifon</option>
          <option value="silifon1">silifon1</option>
        </select>
      </div>
    </div>
    <input id="textInput" type="text" placeholder="输入文本" autocomplete="off" />
    <div class="out-label">硅体</div>
    <div id="silifonOut"></div>
    <p class="hint">点击单字查看字元结构</p>
  </div>

  <div id="modalOverlay" hidden>
    <div id="modal">
      <div id="modalHead">
        <span id="modalTitle">字元结构</span>
        <button id="modalClose" type="button">关闭</button>
      </div>
      <div id="modalBody">
        <div id="jgBlock" hidden>
          <div id="jgLabel">甲骨文</div>
          <div id="jgGrid"></div>
        </div>
        <div id="modalMeta"></div>
        <div class="comp-grid" id="modalGrid"></div>
      </div>
    </div>
  </div>

  <script>
    let compData = null;
    let jgData = null;
    const loadedFonts = new Map();
    let currentFontKey = 'silifon';

    const FONT_VERSION = '20260818183022';
    const FONT_FILES = {
      silifon: 'fonts/silifon.ttf?v=' + FONT_VERSION,
      silifon1: 'fonts/silifon1.ttf?v=' + FONT_VERSION,
    };

    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSize');
    const fontFileSelect = document.getElementById('fontFile');
    const silifonOut = document.getElementById('silifonOut');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMeta = document.getElementById('modalMeta');
    const modalGrid = document.getElementById('modalGrid');
    const modalClose = document.getElementById('modalClose');
    const jgBlock = document.getElementById('jgBlock');
    const jgLabel = document.getElementById('jgLabel');
    const jgGrid = document.getElementById('jgGrid');

    fetch('compound_structure.json?v=' + FONT_VERSION)
      .then(r => r.json())
      .then(data => { compData = data; render(); })
      .catch(() => { compData = {}; render(); });

    fetch('jiaguwen.json?v=' + FONT_VERSION)
      .then(r => r.json())
      .then(data => { jgData = data; })
      .catch(() => { jgData = {}; });

    function fontFamilyId(key) {
      return 'Silifon-' + key + '-' + FONT_VERSION;
    }

    async function ensureFont(key) {
      if (loadedFonts.has(key)) return loadedFonts.get(key);
      const url = FONT_FILES[key];
      if (!url) throw new Error('未知字体');
      const face = new FontFace(fontFamilyId(key), 'url(' + url + ')');
      await face.load();
      document.fonts.add(face);
      loadedFonts.set(key, face);
      return face;
    }

    function readFontSize() {
      const n = parseInt(fontSizeInput.value, 10);
      if (!Number.isFinite(n)) return 48;
      return Math.min(120, Math.max(24, n));
    }

    function applyDisplayStyle() {
      const px = readFontSize();
      fontSizeInput.value = String(px);
      silifonOut.style.setProperty('--glyph-size', px + 'px');
      silifonOut.style.setProperty('--silifon-family', "'" + fontFamilyId(currentFontKey) + "', serif");
    }

    async function setFontFile(key) {
      currentFontKey = key in FONT_FILES ? key : 'silifon';
      fontFileSelect.value = currentFontKey;
      await ensureFont(currentFontKey);
      applyDisplayStyle();
      render();
    }

    function chars(s) {
      return [...(s || '').trim()];
    }

    function svgDataUrl(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function render() {
      applyDisplayStyle();
      const list = chars(textInput.value);
      silifonOut.innerHTML = '';
      if (!list.length) return;

      list.forEach(ch => {
        const el = document.createElement('span');
        el.className = 'glyph';
        el.textContent = ch;
        const hasStruct = compData && compData[ch];
        if (!hasStruct) el.classList.add('no-structure');
        else el.addEventListener('click', () => openStructure(ch, []));
        silifonOut.appendChild(el);
      });
    }

    function canOpen(name, stack) {
      return name && compData && compData[name] && !(stack || []).includes(name);
    }

    function buildCompCard(c, stack) {
      const card = document.createElement('div');
      card.className = 'comp-card';

      const thumb = document.createElement('div');
      thumb.className = 'comp-thumb';
      if (c.svg) {
        const img = document.createElement('img');
        img.src = svgDataUrl(c.svg);
        img.alt = c.name || '';
        thumb.appendChild(img);
      } else {
        thumb.textContent = c.name || '—';
        if (c.kind !== 'compound') {
          thumb.style.fontSize = '0.75rem';
          thumb.style.color = '#aaa';
        }
      }

      const cap = document.createElement('div');
      cap.className = 'comp-cap';
      cap.innerHTML = escapeHtml(c.name || c.ref || '') +
        (c.ref ? '<code>' + escapeHtml(c.ref) + '</code>' : '');

      card.appendChild(thumb);
      card.appendChild(cap);

      if (c.kind === 'compound' && canOpen(c.name, stack)) {
        card.classList.add('clickable');
        card.addEventListener('click', () => openStructure(c.name, stack));
      }
      return card;
    }

    function renderJiaguwen(ch) {
      const variants = jgData && jgData[ch];
      jgGrid.innerHTML = '';
      if (!variants || !variants.length) {
        jgBlock.hidden = true;
        return;
      }
      jgBlock.hidden = false;
      jgLabel.textContent = '甲骨文 · ' + ch + '（' + variants.length + '）';
      variants.forEach(v => {
        const card = document.createElement('div');
        card.className = 'jg-card';
        const thumb = document.createElement('div');
        thumb.className = 'jg-thumb';
        const img = document.createElement('img');
        img.src = svgDataUrl(v.svg);
        img.alt = ch + ' ' + (v.label || '');
        img.loading = 'lazy';
        thumb.appendChild(img);
        const cap = document.createElement('div');
        cap.className = 'jg-cap';
        cap.textContent = v.label || ('表' + v.table);
        card.appendChild(thumb);
        card.appendChild(cap);
        jgGrid.appendChild(card);
      });
    }

    function openStructure(ch, stack) {
      const comp = compData && compData[ch];
      modalTitle.textContent = '字元结构 · ' + ch;
      modalOverlay.hidden = false;
      modalGrid.innerHTML = '';
      renderJiaguwen(ch);

      if (!comp) {
        modalMeta.textContent = '';
        modalGrid.innerHTML = '<p class="empty">暂无结构数据</p>';
        return;
      }

      const comps = comp.components || [];
      let meta = (comp.structure || '') + ' · ' + comps.length + ' 个构件';
      if (comp.meaning) meta += ' · ' + comp.meaning;
      modalMeta.textContent = meta;

      const nextStack = stack.slice();
      if (!nextStack.includes(ch)) nextStack.push(ch);

      comps.forEach(c => modalGrid.appendChild(buildCompCard(c, nextStack)));
    }

    modalClose.addEventListener('click', () => { modalOverlay.hidden = true; });
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) modalOverlay.hidden = true;
    });

    let composing = false;
    textInput.addEventListener('compositionstart', () => { composing = true; });
    textInput.addEventListener('compositionend', () => { composing = false; render(); });
    textInput.addEventListener('input', () => { if (!composing) render(); });
    fontSizeInput.addEventListener('input', () => render());
    fontFileSelect.addEventListener('change', () => {
      setFontFile(fontFileSelect.value).catch(() => {});
    });

    ensureFont('silifon').then(() => applyDisplayStyle()).catch(() => {});

    const q = new URLSearchParams(location.search);
    const init = q.get('text') || q.get('char') || '';
    if (init) {
      textInput.value = init;
      const wait = setInterval(() => {
        if (compData !== null) { clearInterval(wait); render(); }
      }, 50);
      setTimeout(() => clearInterval(wait), 5000);
    }
  </script>
</body>
</html>
