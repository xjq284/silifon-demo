<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SILIFON</title>
  <style>
    @font-face {
      font-family: 'SilifonWeb';
      src: url('fonts/silifon.ttf?v=20260910170500') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Silifon1Web';
      src: url('fonts/silifon1.ttf?v=20260910170500') format('truetype');
      font-display: block;
    }
    :root { font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 40px;
      background: #fafafa; color: #222;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; font-weight: 600; }

    .opts {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      margin-bottom: 16px; align-items: flex-end;
    }
    .opt label {
      display: block; font-size: 0.75rem; color: #666; margin-bottom: 4px;
    }
    .opt select, .opt input[type="number"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; min-width: 100px;
    }

    #textInput {
      width: 100%;
      font-size: 1.1rem;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: "Songti SC", "SimSun", serif;
    }
    #textInput:focus { border-color: #1565c0; }

    .out-label {
      margin: 24px 0 10px;
      font-size: 0.8rem;
      color: #888;
    }
    #silifonOut {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 1;
    }
    .glyph {
      font-family: var(--silifon-family, 'SilifonWeb');
      font-size: var(--glyph-size, 3rem);
      font-feature-settings: "liga" 1, "clig" 1;
      font-variant-ligatures: common-ligatures;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }
    .glyph:hover {
      border-color: #90caf9;
      background: #f5f9ff;
    }
    .glyph.no-structure { cursor: default; opacity: 0.85; }
    .glyph.no-structure:hover { border-color: transparent; background: #fff; }

    .hint { margin-top: 16px; font-size: 0.85rem; color: #666; line-height: 1.55; }
    .hint strong { color: #333; font-weight: 600; }
    .feedback {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }
    .feedback h2 { font-size: 1rem; margin: 0 0 8px; font-weight: 600; }
    .feedback .lead { font-size: 0.85rem; color: #666; line-height: 1.5; margin: 0 0 14px; }
    .feedback label {
      display: block; font-size: 0.75rem; color: #666; margin: 0 0 4px;
    }
    .feedback textarea, .feedback input[type="text"] {
      width: 100%;
      font-size: 0.95rem;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .feedback textarea:focus, .feedback input[type="text"]:focus { border-color: #1565c0; }
    .feedback textarea { min-height: 72px; resize: vertical; }
    #wishChars { font-family: "Songti SC", "SimSun", serif; font-size: 1.15rem; }
    #wishSubmit {
      border: none; background: #1565c0; color: #fff;
      border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem;
    }
    #wishSubmit:hover { background: #0d47a1; }
    .wish-note { font-size: 0.75rem; color: #888; margin: 10px 0 0; }
    #wishList { margin: 18px 0 0; padding: 0; list-style: none; }
    #wishList li {
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }
    #wishList a { color: #1565c0; text-decoration: none; }
    #wishList a:hover { text-decoration: underline; }
    #wishList .meta { display: block; font-size: 0.75rem; color: #999; margin-top: 4px; }
    #wishListStatus { font-size: 0.8rem; color: #888; margin: 8px 0 0; }

    /* 字元结构弹窗 */
    #modalOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 999;
    }
    #modalOverlay[hidden] { display: none; }
    #modal {
      width: 100%; max-width: 640px; max-height: 80vh;
      background: #fff; border-radius: 12px;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
    }
    #modalHead {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    #modalTitle { font-weight: 600; }
    #modalClose {
      border: none; background: #eee; border-radius: 6px;
      padding: 6px 12px; cursor: pointer;
    }
    #modalBody { padding: 16px; overflow: auto; }
    #modalMeta { font-size: 0.85rem; color: #666; margin-bottom: 12px; }
    #jgBlock { margin: 0 0 16px; }
    #jgBlock[hidden] { display: none; }
    #jgLabel { font-size: 0.8rem; color: #888; margin: 0 0 8px; }
    #jgGrid {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .jg-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
    }
    .jg-thumb {
      width: 72px; height: 72px;
      background: #d7d5d0;
      border-radius: 6px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .jg-thumb img { width: 72px; height: 72px; object-fit: contain; }
    .jg-cap { font-size: 0.62rem; color: #888; max-width: 80px; text-align: center; }
    #varBlock { margin: 0 0 16px; }
    #varBlock[hidden] { display: none; }
    #varLabel { font-size: 0.8rem; color: #888; margin: 0 0 8px; }
    #varGrid { display: flex; flex-wrap: wrap; gap: 10px; }
    .var-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
    }
    .var-thumb {
      width: 88px; height: 88px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--silifon-family, 'SilifonWeb');
      font-size: 52px;
      line-height: 1;
      font-feature-settings: "liga" 1, "clig" 1;
      font-variant-ligatures: common-ligatures;
    }
    .var-cap { font-size: 0.65rem; color: #555; }
    .comp-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .comp-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 10px;
      border: 1px solid #e8e8e8; border-radius: 8px;
      min-width: 88px; background: #fafafa;
    }
    .comp-card.clickable { cursor: pointer; }
    .comp-card.clickable:hover { border-color: #90caf9; background: #f5f9ff; }
    .comp-thumb {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Songti SC", serif;
      font-size: 2rem;
      background: #fff; border: 1px solid #eee; border-radius: 6px;
      overflow: hidden;
    }
    .comp-thumb img { width: 64px; height: 64px; object-fit: contain; }
    .comp-cap { font-size: 0.7rem; color: #555; text-align: center; }
    .comp-cap code { display: block; font-size: 0.62rem; color: #999; margin-top: 2px; }
    .empty { color: #999; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SILIFON</h1>
    <div class="opts">
      <div class="opt">
        <label for="fontSize">字体大小</label>
        <input id="fontSize" type="number" min="24" max="120" step="4" value="48" />
      </div>
      <div class="opt">
        <label for="fontFile">字体文件</label>
        <select id="fontFile">
          <option value="silifon">silifon</option>
          <option value="silifon1">silifon1</option>
        </select>
      </div>
    </div>
    <input id="textInput" type="text" placeholder="输入文本" autocomplete="off" />
    <div class="out-label">硅体 <span id="fontStatus"></span></div>
    <div id="silifonOut"></div>
    <p class="hint">
      点击单字查看字元结构。字体由网页加载，无需本机安装。
      <strong>第一次打开（或换用 silifon1）要下载数兆字体，可能要等十几秒甚至更久</strong>，请稍候再看字形。
      目前字体已覆盖《千字文》《三字经》《百家姓》等常用汉字，并在每天增加中。
    </p>
    <section class="feedback" aria-labelledby="wishTitle">
      <h2 id="wishTitle">留言 · 希望哪些字做甲骨文化</h2>
      <p class="lead">告诉我你最希望先补哪些字的甲骨文写法。提交会打开 GitHub Issue（需登录 GitHub）。</p>
      <label for="wishChars">希望增加甲骨文的字</label>
      <input id="wishChars" type="text" placeholder="例如：龍 鳳 車 馬" autocomplete="off" />
      <label for="wishNote">说明（可选）</label>
      <textarea id="wishNote" placeholder="为什么想看这些字，或有无参考字形"></textarea>
      <button id="wishSubmit" type="button">提交留言</button>
      <p class="wish-note">没有 GitHub 账号也可以先写下字，再复制到其他渠道发给我。</p>
      <p id="wishListStatus"></p>
      <ul id="wishList"></ul>
    </section>
  </div>

  <div id="modalOverlay" hidden>
    <div id="modal">
      <div id="modalHead">
        <span id="modalTitle">字元结构</span>
        <button id="modalClose" type="button">关闭</button>
      </div>
      <div id="modalBody">
        <div id="varBlock" hidden>
          <div id="varLabel">字元版本</div>
          <div id="varGrid"></div>
        </div>
        <div id="jgBlock" hidden>
          <div id="jgLabel">甲骨文</div>
          <div id="jgGrid"></div>
        </div>
        <div id="modalMeta"></div>
        <div class="comp-grid" id="modalGrid"></div>
      </div>
    </div>
  </div>

  <script>
    let compData = null;
    let jgData = null;
    let varData = null;
    const loadedFonts = new Map();
    let currentFontKey = 'silifon';

    const FONT_VERSION = '20260910170500';
    const WISH_REPO = 'xjq284/silifon-demo';
    const WISH_TITLE_PREFIX = '甲骨文愿望：';
    const DATA_VERSION = '20260819181800';
    const FONT_FAMILIES = {
      silifon: 'SilifonWeb',
      silifon1: 'Silifon1Web',
    };
    const FONT_FILES = {
      silifon: 'fonts/silifon.ttf?v=' + FONT_VERSION,
      silifon1: 'fonts/silifon1.ttf?v=' + FONT_VERSION,
    };

    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSize');
    const fontFileSelect = document.getElementById('fontFile');
    const silifonOut = document.getElementById('silifonOut');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMeta = document.getElementById('modalMeta');
    const modalGrid = document.getElementById('modalGrid');
    const modalClose = document.getElementById('modalClose');
    const jgBlock = document.getElementById('jgBlock');
    const jgLabel = document.getElementById('jgLabel');
    const jgGrid = document.getElementById('jgGrid');
    const varBlock = document.getElementById('varBlock');
    const varLabel = document.getElementById('varLabel');
    const varGrid = document.getElementById('varGrid');
    const fontStatus = document.getElementById('fontStatus');

    fetch('compound_structure.json?v=' + DATA_VERSION)
      .then(r => r.json())
      .then(data => { compData = data; render(); })
      .catch(() => { compData = {}; render(); });

    fetch('jiaguwen.json?v=' + DATA_VERSION)
      .then(r => r.json())
      .then(data => { jgData = data; })
      .catch(() => { jgData = {}; });

    fetch('glyph_variants.json?v=' + DATA_VERSION)
      .then(r => r.json())
      .then(data => { varData = data; })
      .catch(() => { varData = {}; });

    function fontFamilyId(key) {
      return FONT_FAMILIES[key] || FONT_FAMILIES.silifon;
    }

    function setFontStatus(text) {
      fontStatus.textContent = text ? ' · ' + text : '';
    }

    async function ensureFont(key) {
      if (loadedFonts.has(key)) return loadedFonts.get(key);
      const family = fontFamilyId(key);
      setFontStatus(loadedFonts.size ? '加载字体，请稍候…' : '首次加载字体较慢，请稍候…');
      try {
        if (document.fonts && document.fonts.load) {
          await document.fonts.load('48px "' + family + '"');
        } else {
          const url = FONT_FILES[key];
          const face = new FontFace(family, 'url(' + url + ')');
          await face.load();
          document.fonts.add(face);
        }
        loadedFonts.set(key, family);
        setFontStatus('');
        return family;
      } catch (e) {
        setFontStatus('网页字体加载失败');
        throw e;
      }
    }

    function readFontSize() {
      const n = parseInt(fontSizeInput.value, 10);
      if (!Number.isFinite(n)) return 48;
      return Math.min(120, Math.max(24, n));
    }

    function applyDisplayStyle() {
      const px = readFontSize();
      fontSizeInput.value = String(px);
      silifonOut.style.setProperty('--glyph-size', px + 'px');
      const family = "'" + fontFamilyId(currentFontKey) + "'";
      silifonOut.style.setProperty('--silifon-family', family);
      document.documentElement.style.setProperty('--silifon-family', family);
    }

    async function setFontFile(key) {
      currentFontKey = key in FONT_FILES ? key : 'silifon';
      fontFileSelect.value = currentFontKey;
      await ensureFont(currentFontKey);
      applyDisplayStyle();
      render();
    }

    function chars(s) {
      return [...(s || '').trim()];
    }

    function svgDataUrl(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function render() {
      applyDisplayStyle();
      const list = chars(textInput.value);
      silifonOut.innerHTML = '';
      if (!list.length) return;

      list.forEach(ch => {
        const el = document.createElement('span');
        el.className = 'glyph';
        el.textContent = ch;
        const hasInfo = (compData && compData[ch]) || (varData && varData[ch]) || (jgData && jgData[ch]);
        if (!hasInfo) el.classList.add('no-structure');
        else el.addEventListener('click', () => openStructure(ch, []));
        silifonOut.appendChild(el);
      });
    }

    function canOpen(c, stack) {
      const name = (c && c.name) || '';
      if (!name || (stack || []).includes(name)) return false;
      if (c.kind === 'compound') return !!(compData && compData[name]);
      return true;
    }

    function buildCompCard(c, stack) {
      const card = document.createElement('div');
      card.className = 'comp-card';

      const thumb = document.createElement('div');
      thumb.className = 'comp-thumb';
      if (c.svg) {
        const img = document.createElement('img');
        img.src = svgDataUrl(c.svg);
        img.alt = c.name || '';
        thumb.appendChild(img);
      } else {
        thumb.textContent = c.name || '—';
        if (c.kind !== 'compound') {
          thumb.style.fontSize = '0.75rem';
          thumb.style.color = '#aaa';
        }
      }

      const cap = document.createElement('div');
      cap.className = 'comp-cap';
      cap.innerHTML = escapeHtml(c.name || c.ref || '') +
        (c.ref ? '<code>' + escapeHtml(c.ref) + '</code>' : '');

      card.appendChild(thumb);
      card.appendChild(cap);

      if (canOpen(c, stack)) {
        card.classList.add('clickable');
        card.addEventListener('click', () => openStructure(c.name, stack));
      }
      return card;
    }

    function renderJiaguwen(ch) {
      const variants = jgData && jgData[ch];
      jgGrid.innerHTML = '';
      if (!variants || !variants.length) {
        jgBlock.hidden = true;
        return;
      }
      jgBlock.hidden = false;
      jgLabel.textContent = '甲骨文 · ' + ch + '（' + variants.length + '）';
      variants.forEach(v => {
        const card = document.createElement('div');
        card.className = 'jg-card';
        const thumb = document.createElement('div');
        thumb.className = 'jg-thumb';
        const img = document.createElement('img');
        img.src = svgDataUrl(v.svg);
        img.alt = ch + ' ' + (v.label || '');
        img.loading = 'lazy';
        thumb.appendChild(img);
        const cap = document.createElement('div');
        cap.className = 'jg-cap';
        cap.textContent = v.label || ('表' + v.table);
        card.appendChild(thumb);
        card.appendChild(cap);
        jgGrid.appendChild(card);
      });
    }

    function renderVariants(ch) {
      const variants = varData && varData[ch];
      varGrid.innerHTML = '';
      if (!variants || variants.length < 2) {
        varBlock.hidden = true;
        return;
      }
      varBlock.hidden = false;
      varLabel.textContent = '字元版本（' + variants.length + '）';
      variants.forEach(v => {
        const card = document.createElement('div');
        card.className = 'var-card';
        const thumb = document.createElement('div');
        thumb.className = 'var-thumb';
        thumb.textContent = v.name;
        const cap = document.createElement('div');
        cap.className = 'var-cap';
        cap.textContent = v.name;
        card.appendChild(thumb);
        card.appendChild(cap);
        varGrid.appendChild(card);
      });
    }

    function openStructure(ch, stack) {
      const comp = compData && compData[ch];
      modalOverlay.hidden = false;
      modalGrid.innerHTML = '';
      modalMeta.textContent = '';

      if (comp) {
        // 复合字：显示字元结构
        modalTitle.textContent = '字元结构 · ' + ch;
        varBlock.hidden = true;
        jgBlock.hidden = true;

        const comps = comp.components || [];
        let meta = (comp.structure || '') + ' · ' + comps.length + ' 个构件';
        if (comp.meaning) meta += ' · ' + comp.meaning;
        modalMeta.textContent = meta;

        const nextStack = stack.slice();
        if (!nextStack.includes(ch)) nextStack.push(ch);
        comps.forEach(c => modalGrid.appendChild(buildCompCard(c, nextStack)));
      } else {
        // 字元：显示甲骨文 + 多版本变体
        modalTitle.textContent = '字元详情 · ' + ch;
        renderVariants(ch);
        renderJiaguwen(ch);
        if (varBlock.hidden && jgBlock.hidden) {
          modalMeta.textContent = '暂无甲骨文或多版本数据';
        }
      }
    }

    modalClose.addEventListener('click', () => { modalOverlay.hidden = true; });
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) modalOverlay.hidden = true;
    });

    let composing = false;
    textInput.addEventListener('compositionstart', () => { composing = true; });
    textInput.addEventListener('compositionend', () => { composing = false; render(); });
    textInput.addEventListener('input', () => { if (!composing) render(); });
    fontSizeInput.addEventListener('input', () => render());
    fontFileSelect.addEventListener('change', () => {
      setFontFile(fontFileSelect.value).catch(() => {});
    });

    const wishChars = document.getElementById('wishChars');
    const wishNote = document.getElementById('wishNote');
    const wishSubmit = document.getElementById('wishSubmit');
    const wishList = document.getElementById('wishList');
    const wishListStatus = document.getElementById('wishListStatus');

    function openWishIssue() {
      const charsText = (wishChars.value || '').trim();
      const note = (wishNote.value || '').trim();
      if (!charsText) {
        wishChars.focus();
        return;
      }
      const title = WISH_TITLE_PREFIX + charsText.slice(0, 40);
      const body = '希望增加甲骨文的字：\n' + charsText +
        (note ? '\n\n说明：\n' + note : '');
      const url = 'https://github.com/' + WISH_REPO + '/issues/new?title=' +
        encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
      window.open(url, '_blank', 'noopener');
    }

    function loadWishList() {
      wishListStatus.textContent = '正在读取已有留言…';
      fetch('https://api.github.com/repos/' + WISH_REPO + '/issues?state=open&per_page=30')
        .then(r => {
          if (!r.ok) throw new Error('http ' + r.status);
          return r.json();
        })
        .then(items => {
          const wishes = (items || []).filter(it =>
            !it.pull_request && String(it.title || '').startsWith(WISH_TITLE_PREFIX)
          );
          wishList.innerHTML = '';
          if (!wishes.length) {
            wishListStatus.textContent = '还没有留言，欢迎第一条。';
            return;
          }
          wishListStatus.textContent = '最近留言';
          wishes.forEach(it => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = it.html_url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = it.title;
            const meta = document.createElement('span');
            meta.className = 'meta';
            const who = (it.user && it.user.login) ? it.user.login : '';
            meta.textContent = who + (it.comments ? ' · ' + it.comments + ' 条讨论' : '');
            li.appendChild(a);
            li.appendChild(meta);
            wishList.appendChild(li);
          });
        })
        .catch(() => {
          wishListStatus.textContent = '留言列表暂时读不到，仍可提交新愿望。';
        });
    }

    wishSubmit.addEventListener('click', openWishIssue);
    wishChars.addEventListener('keydown', e => {
      if (e.key === 'Enter') openWishIssue();
    });
    loadWishList();

    ensureFont('silifon').then(() => { applyDisplayStyle(); render(); }).catch(() => {});

    const q = new URLSearchParams(location.search);
    const init = q.get('text') || q.get('char') || '';
    if (init) {
      textInput.value = init;
      const wait = setInterval(() => {
        if (compData !== null) { clearInterval(wait); render(); }
      }, 50);
      setTimeout(() => clearInterval(wait), 5000);
    }
  </script>
</body>
</html>
