<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>硅体展示 · SILIFON</title>
  <link rel="stylesheet" href="glyph-ui.css" />
  <style>
    @font-face {
      font-family: 'SilifonWeb';
      src: url('fonts/silifon.ttf?v=20260920155506') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Silifon1Web';
      src: url('fonts/silifon1.ttf?v=20260920155506') format('truetype');
      font-display: block;
    }
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      --silifon: "SilifonWeb", serif;
      --active-font: "SilifonWeb", serif;
      --glyph-size: 48px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 40px;
      background: #fafafa; color: #222;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; font-weight: 600; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin: 0 0 18px;
    }
    .site-nav a {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 999px;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .site-nav a:hover { border-color: #90caf9; background: #f5f9ff; }
    .site-nav a.current {
      border-color: #1565c0;
      color: #1565c0;
      background: #e3f2fd;
    }

    .opts {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      margin-bottom: 16px; align-items: flex-end;
    }
    .opt label {
      display: block; font-size: 0.75rem; color: #666; margin-bottom: 4px;
    }
    .opt select, .opt input[type="number"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; min-width: 100px;
    }

    #textInput {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      font-size: 1.1rem;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: "Songti SC", "SimSun", serif;
      line-height: 1.45;
    }
    #textInput:focus { border-color: #1565c0; }

    .out-label {
      margin: 24px 0 10px;
      font-size: 0.8rem;
      color: #888;
    }
    #silifonOut {
      min-height: 120px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      font-family: var(--silifon-family, 'SilifonWeb'), serif;
      font-size: var(--glyph-size, 48px);
      line-height: 1.25;
      word-break: break-all;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: auto;
    }
    .glyph {
      font-family: inherit;
      font-size: inherit;
      font-feature-settings: "liga" 1, "clig" 1;
      font-variant-ligatures: common-ligatures;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
    }
    .glyph:hover {
      background: #f5f9ff;
      box-shadow: inset 0 0 0 1px #90caf9;
    }
    .glyph-space {
      white-space: pre;
    }

    .hint { margin-top: 16px; font-size: 0.85rem; color: #666; line-height: 1.55; }
    .hint strong { color: #333; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>硅体展示</h1>
    <nav class="site-nav" aria-label="站点导航">
      <a class="current" href="./">硅体展示</a>
      <a href="./shuowen.html">单字说文</a>
      <a href="./classical/">古文学习</a>
    </nav>

    <div class="opts">
      <div class="opt">
        <label for="fontSize">字号</label>
        <input id="fontSize" type="number" min="24" max="120" step="4" value="48" />
      </div>
      <div class="opt">
        <label for="fontFile">字体文件</label>
        <select id="fontFile">
          <option value="silifon">silifon</option>
          <option value="silifon1">silifon1</option>
        </select>
      </div>
    </div>
    <label for="textInput" style="display:block;font-size:0.75rem;color:#666;margin:0 0 4px;">展示文本</label>
    <textarea id="textInput" placeholder="在此输入汉字或句子，可换行…" autocomplete="off"></textarea>
    <div class="out-label">硅体 <span id="fontStatus"></span></div>
    <div id="silifonOut"></div>
    <p class="hint">
      点击单字查看字元结构与构形动画。字体由网页加载，无需本机安装。
      <strong>第一次打开（或换用 silifon1）要下载数兆字体，可能要等十几秒甚至更久</strong>，请稍候再看字形。
      目前字体已覆盖《千字文》《三字经》《百家姓》等常用汉字，并在每天增加中。
    </p>
  </div>

  <script src="glyph-ui.js"></script>
  <script src="glyph-anim.js"></script>
  <script>
    const loadedFonts = new Map();
    let currentFontKey = 'silifon';

    const FONT_VERSION = '20260920155506';
    const FONT_FAMILIES = {
      silifon: 'SilifonWeb',
      silifon1: 'Silifon1Web',
    };
    const FONT_FILES = {
      silifon: 'fonts/silifon.ttf?v=' + FONT_VERSION,
      silifon1: 'fonts/silifon1.ttf?v=' + FONT_VERSION,
    };

    GlyphUI.init({ baseUrl: './' });

    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSize');
    const fontFileSelect = document.getElementById('fontFile');
    const silifonOut = document.getElementById('silifonOut');
    const fontStatus = document.getElementById('fontStatus');

    function fontFamilyId(key) {
      return FONT_FAMILIES[key] || FONT_FAMILIES.silifon;
    }

    function applyDisplayStyle() {
      const size = Math.min(120, Math.max(24, Number(fontSizeInput.value) || 48));
      fontSizeInput.value = String(size);
      document.documentElement.style.setProperty('--glyph-size', size + 'px');
      document.documentElement.style.setProperty('--silifon-family', "'" + fontFamilyId(currentFontKey) + "'");
      document.documentElement.style.setProperty('--silifon', "'" + fontFamilyId(currentFontKey) + "', serif");
      document.documentElement.style.setProperty('--active-font', "'" + fontFamilyId(currentFontKey) + "', serif");
    }

    async function ensureFont(key) {
      if (loadedFonts.has(key)) return loadedFonts.get(key);
      const family = fontFamilyId(key);
      const url = FONT_FILES[key];
      const face = new FontFace(family, "url('" + url + "')", { display: 'block' });
      const p = face.load().then((f) => {
        document.fonts.add(f);
        return f;
      });
      loadedFonts.set(key, p);
      return p;
    }

    async function setFontFile(key) {
      currentFontKey = key;
      fontStatus.textContent = '加载中…';
      try {
        await ensureFont(key);
        fontStatus.textContent = '';
        applyDisplayStyle();
        render();
      } catch (e) {
        fontStatus.textContent = '字体加载失败';
      }
    }

    function render() {
      applyDisplayStyle();
      const raw = textInput.value || '';
      silifonOut.innerHTML = '';
      for (const ch of raw) {
        if (ch === '\n') {
          silifonOut.appendChild(document.createElement('br'));
          continue;
        }
        const el = document.createElement('span');
        if (/\s/u.test(ch)) {
          el.className = 'glyph-space';
          el.textContent = ch;
        } else {
          el.className = 'glyph';
          el.textContent = ch;
          el.addEventListener('click', () => GlyphUI.open(ch));
        }
        silifonOut.appendChild(el);
      }
    }

    let composing = false;
    textInput.addEventListener('compositionstart', () => { composing = true; });
    textInput.addEventListener('compositionend', () => { composing = false; render(); });
    textInput.addEventListener('input', () => { if (!composing) render(); });
    fontSizeInput.addEventListener('input', () => render());
    fontFileSelect.addEventListener('change', () => {
      setFontFile(fontFileSelect.value).catch(() => {});
    });

    ensureFont('silifon').then(() => { applyDisplayStyle(); render(); }).catch(() => {});

    const q = new URLSearchParams(location.search);
    const init = q.get('text') || q.get('char') || '';
    if (init) textInput.value = init;
  </script>
</body>
</html>
